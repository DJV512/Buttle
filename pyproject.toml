[project]
name = "buttle"
version = "0.4.0"
description = "Command-line utilities for DNA and protein sequence analysis. At your service."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.15"
dependencies = [
    "pillow>=13.0.0",
]

[project.scripts]
buttle = "buttle.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "maturin>=1.15.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.0.0",
]

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "rust/Cargo.toml"
features = ["python"]
python-source = "src"
module-name = "buttle.buttle_rust"

[tool.pytest.ini_options]
addopts = [
    "--cov=buttle",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=html",
    "-vv",
]

[project.urls]
Homepage = "https://github.com/DJV512/Buttle"
Repository = "https://github.com/DJV512/Buttle"
Issues = "https://github.com/DJV512/Buttle/issues"
